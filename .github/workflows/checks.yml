# The checks CONTRIBUTING.md asks of every change, and a few more: the host
# tests, Platform/ built for each Apple platform and its tests run on Mac
# Catalyst against Apple's SpriteKit, the runtime cross-compiled
# for both Android ABIs, the Android library, the game templates built into
# an APK that's run on an emulator, the tools' tests and shellcheck.
#
# A pull request runs only the jobs whose files it changes (`changes`); a
# push to main runs them all. `Checks passed` is the one check main requires:
# it waits on the rest and passes when none failed, skipped ones included.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SWIFT_VERSION: 6.4.2
  SWIFT_SDK_URL: https://download.swift.org/swift-6.4.2-release/android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz
  SWIFT_SDK_SHA256: 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
  NDK_VERSION: r30
  # What the runtime is developed with; the xcode-27 image has it.
  XCODE_VERSION: 27.2

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      host: ${{ github.event_name != 'pull_request' || steps.filter.outputs.host == 'true' }}
      apple: ${{ github.event_name != 'pull_request' || steps.filter.outputs.apple == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
      library: ${{ github.event_name != 'pull_request' || steps.filter.outputs.library == 'true' }}
      template: ${{ github.event_name != 'pull_request' || steps.filter.outputs.template == 'true' }}
      tools: ${{ github.event_name != 'pull_request' || steps.filter.outputs.tools == 'true' }}
      shell: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shell == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ci: &ci
              - '.github/**'
            host:
              - *ci
              - 'Package.swift'
              - 'Sources/**'
              - 'Tests/**'
              - 'Text/**'
              - 'Platform/**'
              - 'Vendor/build.sh'
              - 'Vendor/versions.sh'
            apple:
              - *ci
              - 'Package.swift'
              - 'Sources/**'
              - 'Platform/**'
            android: &android
              - *ci
              - 'Package.swift'
              - 'Sources/**'
              - 'Modules/**'
              - 'Shell/**'
              - 'Text/**'
              - 'Platform/**'
              - 'Vendor/build.sh'
              - 'Vendor/versions.sh'
              - 'Scripts/config.sh'
              - 'Scripts/build-sdl.sh'
              - 'Scripts/check-android.sh'
            library: &library
              - *ci
              - 'Library/**'
              - 'Scripts/config.sh'
            template:
              - *android
              - *library
              - 'Templates/**'
              - 'Scripts/build-shell.sh'
              - 'Scripts/check-template.sh'
              - 'Scripts/signing.sh'
              - 'Tools/Art/**'
              - 'Tools/guard.js'
            tools:
              - *ci
              - 'Tools/**'
            shell:
              - *ci
              - '**/*.sh'
              - '.shellcheckrc'

  tools:
    name: Tools tests
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node tests
        run: node --test $(git ls-files 'Tools/*.test.js' 'Tools/**/*.test.js')
      - name: Pricing tests
        run: python3 -m unittest discover -s Tools/Pricing

  shellcheck:
    name: shellcheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Warnings and errors; .shellcheckrc says what's left out and why.
      - name: shellcheck
        run: shellcheck -x -S warning $(git ls-files '*.sh')

  host:
    name: Host tests
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      # The checkout's folder must be named spritekit-android: SwiftPM takes
      # the package's identity from it (Actions checks out into the repo's name).
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          swift --version
      - name: Install cmake and ninja
        run: brew install ninja cmake || true
      - uses: actions/cache@v4
        with:
          path: |
            Vendor/src/*.tar.xz
            Vendor/out/host
          key: vendor-host-${{ runner.os }}-${{ hashFiles('Vendor/versions.sh', 'Vendor/build.sh') }}
      - name: FreeType and HarfBuzz for the host
        run: '[ -d Vendor/out/host/lib/pkgconfig ] || Vendor/build.sh host'
      - name: swift test
        run: swift test
      - name: swift test --package-path Platform
        run: swift test --package-path Platform
      - name: swift test --package-path Text
        run: PKG_CONFIG_PATH="$PWD/Vendor/out/host/lib/pkgconfig" swift test --package-path Text

  apple:
    name: Platform on ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: tvOS
            destination: generic/platform=tvOS Simulator
          - name: Mac Catalyst
            destination: generic/platform=macOS,variant=Mac Catalyst
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Build
        working-directory: Platform
        run: |
          xcodebuild build -scheme SpriteKitPlatform-Package \
            -destination '${{ matrix.destination }}' \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | tail -200
          exit "${PIPESTATUS[0]}"

  catalyst:
    name: Platform tests on Mac Catalyst
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      # Named spritekit-android, as the host tests need it (the package's identity).
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      # Platform's tests against Apple's own SpriteKit, UIKit and CoreText,
      # where the host tests run them against the shim.
      - name: Test
        working-directory: Platform
        run: |
          xcodebuild test -scheme SpriteKitPlatform-Package \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -400
          exit "${PIPESTATUS[0]}"

  android:
    name: Android (${{ matrix.abi }})
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-toolchain
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-sdk-url: ${{ env.SWIFT_SDK_URL }}
          swift-sdk-sha256: ${{ env.SWIFT_SDK_SHA256 }}
          ndk-version: ${{ env.NDK_VERSION }}
      - uses: actions/cache@v4
        with:
          path: Vendor/sdl3/${{ matrix.abi }}
          key: sdl-${{ matrix.abi }}-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('Scripts/config.sh', 'Scripts/build-sdl.sh') }}
      - name: SDL
        run: '[ -d Vendor/sdl3/${{ matrix.abi }}/include ] || Scripts/build-sdl.sh ${{ matrix.abi }}'
      - name: Cross-compile
        run: Scripts/check-android.sh ${{ matrix.abi }}

  library:
    name: Android library
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The library compiles SDL's Java from the pinned checkout in place.
      - name: SDL's Java
        run: |
          . Scripts/config.sh
          git clone -q --depth 1 --branch "$SDL_TAG" "$SDL_REPO" Vendor/SDL
      - name: Build and test
        working-directory: Library
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

  template:
    name: Game template on an emulator
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-toolchain
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-sdk-url: ${{ env.SWIFT_SDK_URL }}
          swift-sdk-sha256: ${{ env.SWIFT_SDK_SHA256 }}
          ndk-version: ${{ env.NDK_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@v4
      # What signing.sh's debug step would fetch from 1Password on a Mac.
      - name: Debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build the APK
        run: Scripts/check-template.sh x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: .github/scripts/emulator-smoke.sh .build/template-check/Android/App/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-emulator
          path: |
            logcat.txt
            screen.png
          if-no-files-found: ignore

  passed:
    name: Checks passed
    needs: [changes, tools, shellcheck, host, apple, catalyst, android, library, template]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          ! jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$NEEDS" >/dev/null
