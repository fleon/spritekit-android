org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true

# The SDK platform to compile and target against.
game.compileSdk=36
game.targetSdk=36

# The native code is linked against API 23 stubs (the runtime's
# Scripts/config.sh), lower than this on purpose — a binary may require less
# than the app declares. 24 is the floor the app itself supports.
game.minSdk=24
