org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true

# The SDK platform to compile and target against. Kept in one place because
# it is the thing most likely to need changing: if a different platform is
# installed, change these two rather than app/build.gradle.kts.
switchlings.compileSdk=36
switchlings.targetSdk=36

# The native code is linked against API 23 stubs (Android/Scripts/config.sh),
# which is lower than this on purpose — a binary may require less than the app
# declares. 24 is the floor the app itself supports.
switchlings.minSdk=24
